<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>블록 블라스트 (Block Blast)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: #0f172a;
            overflow: hidden;
        }
        .grid-cell {
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .block-cell {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .ghost-valid {
            background-color: rgba(52, 211, 153, 0.45) !important;
            border: 2px dashed #10b981 !important;
        }
        .ghost-invalid {
            background-color: rgba(248, 113, 113, 0.35) !important;
            border: 2px dashed #ef4444 !important;
        }
        .clearing {
            animation: clearAnimation 0.35s ease-out forwards;
        }
        @keyframes clearAnimation {
            0% { transform: scale(1); filter: brightness(1.8); }
            50% { transform: scale(1.15); filter: brightness(2.5); }
            100% { transform: scale(0); opacity: 0; }
        }
        .combo-popup {
            animation: popupAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popupAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(3deg); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(0.9) rotate(0deg); }
        }
        .tray-piece {
            transition: transform 0.15s ease;
            touch-action: none;
        }
        .tray-piece:active {
            transform: scale(1.05);
        }
        /* Custom scrollbar for game modals */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between text-white p-3 sm:p-6 select-none relative overflow-hidden bg-slate-950">

    <!-- Background Glow Effect -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-fuchsia-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center z-10 pt-2 mb-2">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-500/30">
                <i class="fa-solid font-black text-xl text-white">B</i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-rose-400 to-indigo-400">
                    BLOCK BLAST
                </h1>
                <p class="text-xs text-slate-400 font-medium">퍼즐 블록 퍼펙트 클리어</p>
            </div>
        </div>

        <!-- Mute & Info Buttons -->
        <div class="flex items-center space-x-2">
            <button id="leaderboardBtn" class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-amber-400 hover:text-amber-300 hover:bg-slate-700 transition" title="실시간 랭킹">
                <i class="fa-solid fa-trophy"></i>
            </button>
            <button id="soundToggleBtn" class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
            <button id="restartBtn" class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- Score & Streak Banner -->
    <div class="w-full max-w-md grid grid-cols-2 gap-3 z-10 mb-2">
        <div class="bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center shadow-inner">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                <i class="fa-solid fa-trophy text-amber-400"></i> 최고 점수
            </span>
            <span id="bestScore" class="text-2xl font-black text-amber-400 tracking-tight">0</span>
        </div>
        <div class="bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-3 flex flex-col items-center justify-center shadow-inner">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1">
                <i class="fa-solid fa-star text-indigo-400"></i> 현재 점수
            </span>
            <span id="currentScore" class="text-2xl font-black text-white tracking-tight">0</span>
        </div>
    </div>

    <!-- Main Game Board Container -->
    <div class="relative w-full max-w-md aspect-square flex items-center justify-center z-10 my-auto">
        <!-- 8x8 Grid Canvas & Slots -->
        <div id="gridBoard" class="w-full h-full bg-slate-900/90 border-2 border-slate-800/80 rounded-2xl p-2.5 grid grid-cols-8 grid-rows-8 gap-1.5 shadow-2xl relative overflow-hidden backdrop-blur-md">
            <!-- Grid Cells will be generated dynamically by JS -->
        </div>

        <!-- Canvas Effect Layer for Particles -->
        <canvas id="particleCanvas" class="absolute inset-0 pointer-events-none w-full h-full z-20"></canvas>

        <!-- Combo floating text container -->
        <div id="comboContainer" class="absolute inset-0 pointer-events-none z-30"></div>
    </div>

    <!-- Tray Container (3 Piece Slots) -->
    <div class="w-full max-w-md z-10 mt-auto pb-4">
        <div id="tray" class="w-full bg-slate-900/60 backdrop-blur border border-slate-800/80 rounded-2xl p-3 flex justify-around items-center min-h-[120px]">
            <!-- 3 Piece slots -->
            <div class="tray-slot w-1/3 aspect-square flex items-center justify-center p-1 relative" data-slot="0"></div>
            <div class="tray-slot w-1/3 aspect-square flex items-center justify-center p-1 relative" data-slot="1"></div>
            <div class="tray-slot w-1/3 aspect-square flex items-center justify-center p-1 relative" data-slot="2"></div>
        </div>
    </div>

    <!-- Dragging Floating Helper -->
    <div id="dragProxy" class="fixed pointer-events-none z-50 hidden opacity-90 transform -translate-x-1/2 -translate-y-1/2 scale-100 transition-transform"></div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modalCard">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-rose-500 to-purple-600 flex items-center justify-center mb-4 shadow-lg shadow-rose-500/30">
                <i class="fa-solid fa-gamepad text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-black text-white mb-1">게임 오버!</h2>
            <p class="text-slate-400 text-sm mb-6">더 이상 블록을 놓을 수 있는 공간이 없습니다.</p>

            <div class="bg-slate-950/60 rounded-2xl p-4 mb-6 space-y-3 border border-slate-800/80">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm font-medium">최종 점수</span>
                    <span id="finalScore" class="text-2xl font-black text-amber-400">0</span>
                </div>
                <div class="h-px bg-slate-800 w-full"></div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm font-medium">최고 기록</span>
                    <span id="finalBestScore" class="text-lg font-bold text-slate-200">0</span>
                </div>
            </div>

            <button id="modalRestartBtn" class="w-full py-4 bg-gradient-to-r from-amber-500 via-rose-500 to-indigo-500 rounded-2xl text-white font-black text-lg shadow-lg hover:brightness-110 active:scale-95 transition-all">
                다시 도전하기
            </button>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm sm:max-w-md text-center shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col max-h-[85vh]" id="leaderboardCard">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-trophy text-xl"></i>
                    </div>
                    <h2 class="text-2xl font-black text-white">실시간 랭킹</h2>
                </div>
                <button id="closeLeaderboardBtn" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Nickname Setup Bar -->
            <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-3 mb-3 flex items-center space-x-2">
                <i class="fa-solid fa-user text-slate-400 ml-1"></i>
                <input type="text" id="nicknameInput" maxlength="10" placeholder="닉네임 입력 (최대 10자)" class="bg-transparent text-white text-sm focus:outline-none flex-1 font-bold">
                <button id="saveNicknameBtn" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition">
                    저장
                </button>
            </div>

            <!-- Leaderboard List -->
            <div id="leaderboardList" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2 text-left min-h-[200px]">
                <div class="text-center py-12 text-slate-500 font-medium">랭킹 불러오는 중...</div>
            </div>

            <!-- Submit to GitHub Issue Action -->
            <button id="submitScoreGithubBtn" class="w-full py-2.5 mb-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-2">
                <i class="fa-brands fa-github text-sm"></i>
                <span>내 최고 점수 GitHub Issue로 등록하기</span>
            </button>

            <!-- User ID & Repo Display -->
            <div class="mt-2 pt-2 border-t border-slate-800 text-slate-500 text-[10px] font-mono truncate flex justify-between items-center">
                <span>Repository: <strong class="text-slate-400">sunha12345/block-blast</strong></span>
                <a href="https://github.com/sunha12345/block-blast/issues" target="_blank" class="text-indigo-400 hover:underline">이슈 바로가기 <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></a>
            </div>
        </div>
    </div>

    <!-- Audio & Logic JavaScript -->
    <script>
        // ==========================================
        // GITHUB ISSUES LEADERBOARD SYSTEM
        // ==========================================
        const GITHUB_OWNER = 'sunha12345';
        const GITHUB_REPO = 'block-blast';
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?state=all&per_page=100`;

        let playerNickname = localStorage.getItem('blockblast_nickname') || '익명 블록왕';

        // Fetch Leaderboard from GitHub Issues
        async function fetchGitHubLeaderboard() {
            const listEl = document.getElementById('leaderboardList');
            if (listEl) {
                listEl.innerHTML = '<div class="text-center py-12 text-slate-500 font-medium"><i class="fa-solid fa-spinner fa-spin mr-2"></i>GitHub Issues 랭킹 불러오는 중...</div>';
            }
            
            try {
                const response = await fetch(GITHUB_API_URL);
                if (!response.ok) throw new Error('GitHub API 요청 실패');
                const issues = await response.json();
                
                const scores = [];
                issues.forEach(issue => {
                    // Match pattern: "Score: 1200 - PlayerName" or "🏆 Score: 1200 - PlayerName" or "[Score] 1200"
                    const title = issue.title || '';
                    const match = title.match(/(?:Score:\s*|점수:\s*|\[)?(\d+)(?:\])?\s*[-|:]\s*(.+)/i) || 
                                  title.match(/(\d+)\s*점\s*[-|:]?\s*(.*)/i);
                    
                    let score = 0;
                    let nickname = issue.user ? issue.user.login : '익명';

                    if (match) {
                        score = parseInt(match[1], 10);
                        if (match[2] && match[2].trim()) nickname = match[2].trim();
                    } else {
                        const bodyMatch = issue.body ? issue.body.match(/Score:\s*(\d+)/i) : null;
                        if (bodyMatch) score = parseInt(bodyMatch[1], 10);
                    }

                    if (score > 0) {
                        scores.push({
                            id: issue.id,
                            nickname: nickname,
                            score: score,
                            userUrl: issue.user ? issue.user.html_url : '#',
                            issueUrl: issue.html_url,
                            avatar: issue.user ? issue.user.avatar_url : null
                        });
                    }
                });

                // Sort High to Low
                scores.sort((a, b) => b.score - a.score);
                renderLeaderboardList(scores);
            } catch (err) {
                console.error("GitHub Leaderboard Error:", err);
                if (listEl) {
                    listEl.innerHTML = `
                        <div class="text-center py-8 text-slate-400 space-y-2">
                            <p class="text-xs text-rose-400 font-bold">랭킹 데이터를 가져올 수 없습니다.</p>
                            <p class="text-[11px] text-slate-500">저장소 <code>${GITHUB_OWNER}/${GITHUB_REPO}</code>의 Issue에 점수가 있는지 확인해 주세요.</p>
                        </div>
                    `;
                }
            }
        }

        // Open GitHub New Issue Page for Score Submission
        function openGitHubScoreSubmission(scoreToSubmit) {
            const targetScore = scoreToSubmit || parseInt(localStorage.getItem('blockblast_best_score')) || 0;
            if (targetScore <= 0) {
                const listEl = document.getElementById('leaderboardList');
                if (listEl) {
                    const originalContent = listEl.innerHTML;
                    listEl.innerHTML = '<div class="text-center py-4 text-amber-400 font-bold text-xs">먼저 게임을 플레이하여 점수를 획득해 주세요!</div>';
                    setTimeout(() => listEl.innerHTML = originalContent, 2000);
                }
                return;
            }
            const title = encodeURIComponent(`🏆 Score: ${targetScore} - ${playerNickname}`);
            const body = encodeURIComponent(`### 🎮 Block Blast 최고 점수 등록\n\n- **선수 닉네임**: ${playerNickname}\n- **최고 점수**: ${targetScore}점\n\nIssue를 제출(Submit new issue)하면 GitHub 랭킹 리더보드에 자동으로 등록됩니다!`);
            const issueUrl = `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/issues/new?title=${title}&body=${body}&labels=leaderboard`;
            window.open(issueUrl, '_blank');
        }

        // Render Leaderboard UI
        function renderLeaderboardList(scores) {
            const listEl = document.getElementById('leaderboardList');
            if (!listEl) return;

            if (scores.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 text-slate-500">
                        <i class="fa-brands fa-github text-3xl mb-2 text-slate-600 block"></i>
                        등록된 GitHub Issue 점수가 없습니다.<br>첫 번째 이슈를 남겨보세요!
                    </div>
                `;
                return;
            }

            listEl.innerHTML = scores.map((item, index) => {
                const rank = index + 1;
                let rankBadge = `<span class="w-6 font-bold text-center text-slate-400 text-sm">${rank}</span>`;
                if (rank === 1) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-500 text-slate-950 font-black flex items-center justify-center text-xs shadow-md shadow-amber-500/30">1</span>`;
                else if (rank === 2) rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-300 text-slate-950 font-black flex items-center justify-center text-xs">2</span>`;
                else if (rank === 3) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-700 text-white font-black flex items-center justify-center text-xs">3</span>`;

                const avatarImg = item.avatar 
                    ? `<img src="${item.avatar}" class="w-5 h-5 rounded-full inline mr-1 border border-slate-600">`
                    : `<i class="fa-solid fa-user text-xs mr-1 text-slate-400"></i>`;

                return `
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-800/40 border border-slate-700/30 hover:border-slate-600 transition">
                        <div class="flex items-center space-x-2.5 overflow-hidden pr-2">
                            ${rankBadge}
                            <a href="${item.issueUrl}" target="_blank" class="font-bold text-sm text-slate-200 hover:text-indigo-400 truncate flex items-center">
                                ${avatarImg} ${escapeHtml(item.nickname)}
                            </a>
                        </div>
                        <span class="font-black text-amber-400 text-base tracking-tight">${item.score.toLocaleString()}</span>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ==========================================
        // 1. CONSTANTS & SHAPE DEFINITIONS
        // ==========================================
        const GRID_SIZE = 8;
        
        // Block shape definitions (2D arrays with color classes)
        const BLOCK_DESIGNS = [
            // 1x1
            { shape: [[1]], color: 'from-amber-400 to-orange-500' },
            // 2x1 & 1x2
            { shape: [[1, 1]], color: 'from-cyan-400 to-blue-500' },
            { shape: [[1], [1]], color: 'from-cyan-400 to-blue-500' },
            // 3x1 & 1x3
            { shape: [[1, 1, 1]], color: 'from-emerald-400 to-teal-600' },
            { shape: [[1], [1], [1]], color: 'from-emerald-400 to-teal-600' },
            // 4x1 & 1x4
            { shape: [[1, 1, 1, 1]], color: 'from-violet-500 to-purple-600' },
            { shape: [[1], [1], [1], [1]], color: 'from-violet-500 to-purple-600' },
            // 2x2 Square
            { shape: [[1, 1], [1, 1]], color: 'from-amber-300 to-yellow-500' },
            // 3x3 Square
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: 'from-rose-500 to-red-600' },
            // L Shapes
            { shape: [[1, 0], [1, 1]], color: 'from-pink-400 to-rose-500' },
            { shape: [[0, 1], [1, 1]], color: 'from-pink-400 to-rose-500' },
            { shape: [[1, 1], [1, 0]], color: 'from-pink-400 to-rose-500' },
            { shape: [[1, 1], [0, 1]], color: 'from-pink-400 to-rose-500' },
            // Big L Shapes
            { shape: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], color: 'from-indigo-400 to-blue-600' },
            { shape: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], color: 'from-indigo-400 to-blue-600' },
            // T Shapes
            { shape: [[1, 1, 1], [0, 1, 0]], color: 'from-fuchsia-400 to-pink-600' },
            { shape: [[0, 1, 0], [1, 1, 1]], color: 'from-fuchsia-400 to-pink-600' },
            { shape: [[1, 0], [1, 1], [1, 0]], color: 'from-fuchsia-400 to-pink-600' }
        ];

        // Sound Effects Controller using Web Audio API
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPop(freq = 400) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playPlace() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(320, this.ctx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playClear(combo = 1) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C E G C E G
                const baseNote = Math.min(combo - 1, notes.length - 1);
                
                for (let i = 0; i < 3; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const noteFreq = notes[(baseNote + i) % notes.length];
                    osc.frequency.setValueAtTime(noteFreq, now + i * 0.06);

                    gain.gain.setValueAtTime(0.3, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.25);
                }
            }

            playGameOver() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.5);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        const soundEngine = new SoundEngine();

        // Particle System for Line Clears
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            spawn(x, y, color = '#f59e0b', count = 12) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6 + 2;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * 4 + 2,
                        color: color,
                        alpha: 1,
                        decay: Math.random() * 0.03 + 0.02
                    });
                }
            }

            updateAndRender() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15; // Gravity
                    p.alpha -= p.decay;

                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }

                requestAnimationFrame(() => this.updateAndRender());
            }
        }

        // ==========================================
        // 2. GAME STATE & DOM ELEMENTS
        // ==========================================
        let gridState = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let trayPieces = [null, null, null];
        let score = 0;
        let bestScore = localStorage.getItem('blockblast_best_score') || 0;
        let comboStreak = 0;

        // Dragging State
        let activeDrag = {
            slotIndex: null,
            pieceData: null,
            element: null,
            offsetX: 0,
            offsetY: 0,
            targetRow: -1,
            targetCol: -1
        };

        // DOM elements
        const gridBoard = document.getElementById('gridBoard');
        const traySlots = document.querySelectorAll('.tray-slot');
        const dragProxy = document.getElementById('dragProxy');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        const gameOverModal = document.getElementById('gameOverModal');
        const modalCard = document.getElementById('modalCard');
        const finalScoreEl = document.getElementById('finalScore');
        const finalBestScoreEl = document.getElementById('finalBestScore');
        const restartBtn = document.getElementById('restartBtn');
        const modalRestartBtn = document.getElementById('modalRestartBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const particleCanvas = document.getElementById('particleCanvas');
        const comboContainer = document.getElementById('comboContainer');

        // Leaderboard UI elements
        const leaderboardModal = document.getElementById('leaderboardModal');
        const leaderboardCard = document.getElementById('leaderboardCard');
        const leaderboardBtn = document.getElementById('leaderboardBtn');
        const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
        const nicknameInput = document.getElementById('nicknameInput');
        const saveNicknameBtn = document.getElementById('saveNicknameBtn');

        const particles = new ParticleSystem(particleCanvas);
        particles.updateAndRender();

        // ==========================================
        // 3. INITIALIZATION & BOARD SETUP
        // ==========================================
        function initGame() {
            score = 0;
            comboStreak = 0;
            gridState = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            bestScore = parseInt(localStorage.getItem('blockblast_best_score')) || 0;

            updateScoreDisplays();
            renderBoard();
            spawnTrayPieces();
            hideGameOver();
        }

        function renderBoard() {
            gridBoard.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.className = 'grid-cell w-full h-full rounded-xl bg-slate-800/60 border border-slate-700/30 flex items-center justify-center relative overflow-hidden';
                    
                    if (gridState[r][c]) {
                        const block = document.createElement('div');
                        block.className = `w-full h-full rounded-lg bg-gradient-to-br ${gridState[r][c]} block-cell shadow-md`;
                        cell.appendChild(block);
                    }
                    gridBoard.appendChild(cell);
                }
            }
        }

        function updateScoreDisplays() {
            currentScoreEl.textContent = score;
            bestScoreEl.textContent = bestScore;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('blockblast_best_score', bestScore);
                bestScoreEl.textContent = bestScore;
            }
        }

        // ==========================================
        // 4. TRAY & PIECE GENERATION
        // ==========================================
        function getRandomPiece() {
            const randomIndex = Math.floor(Math.random() * BLOCK_DESIGNS.length);
            return JSON.parse(JSON.stringify(BLOCK_DESIGNS[randomIndex]));
        }

        function spawnTrayPieces() {
            trayPieces = [getRandomPiece(), getRandomPiece(), getRandomPiece()];
            renderTray();
            checkGameOver();
        }

        function renderTray() {
            traySlots.forEach((slot, index) => {
                slot.innerHTML = '';
                const piece = trayPieces[index];
                if (!piece) return;

                const pieceEl = createPieceDOM(piece, 24); // 24px per mini block in tray
                pieceEl.classList.add('tray-piece', 'cursor-grab', 'hover:scale-105', 'active:cursor-grabbing');
                pieceEl.dataset.slot = index;

                // Bind pointer down to start drag
                pieceEl.addEventListener('pointerdown', (e) => onPointerDown(e, index));

                slot.appendChild(pieceEl);
            });
        }

        function createPieceDOM(pieceData, cellSize = 30) {
            const shape = pieceData.shape;
            const rows = shape.length;
            const cols = shape[0].length;

            const container = document.createElement('div');
            container.style.display = 'grid';
            container.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
            container.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
            container.style.gap = '2px';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const block = document.createElement('div');
                    if (shape[r][c] === 1) {
                        block.className = `w-full h-full rounded-md bg-gradient-to-br ${pieceData.color} block-cell shadow-sm`;
                    } else {
                        block.className = 'w-full h-full bg-transparent';
                    }
                    container.appendChild(block);
                }
            }
            return container;
        }

        // ==========================================
        // 5. DRAG & DROP LOGIC (POINTER EVENTS)
        // ==========================================
        function onPointerDown(e, slotIndex) {
            e.preventDefault();
            const pieceData = trayPieces[slotIndex];
            if (!pieceData) return;

            soundEngine.playPop(350);

            // Set dragging state
            activeDrag.slotIndex = slotIndex;
            activeDrag.pieceData = pieceData;

            // Setup Proxy floating piece
            dragProxy.innerHTML = '';
            const gridCellRect = gridBoard.children[0].getBoundingClientRect();
            const proxyDOM = createPieceDOM(pieceData, gridCellRect.width);
            dragProxy.appendChild(proxyDOM);
            dragProxy.classList.remove('hidden');

            moveProxy(e.clientX, e.clientY);

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);

            updateDragHover(e.clientX, e.clientY);
        }

        function moveProxy(x, y) {
            const offsetY = window.innerWidth < 640 ? 60 : 40;
            dragProxy.style.left = `${x}px`;
            dragProxy.style.top = `${y - offsetY}px`;
        }

        function onPointerMove(e) {
            if (activeDrag.slotIndex === null) return;
            moveProxy(e.clientX, e.clientY);
            updateDragHover(e.clientX, e.clientY);
        }

        function updateDragHover(x, y) {
            clearGhostHighlights();

            const proxyRect = dragProxy.getBoundingClientRect();
            const gridRect = gridBoard.getBoundingClientRect();

            const relativeX = proxyRect.left - gridRect.left;
            const relativeY = proxyRect.top - gridRect.top;

            const cellWidth = gridRect.width / GRID_SIZE;
            const cellHeight = gridRect.height / GRID_SIZE;

            const col = Math.round(relativeX / cellWidth);
            const row = Math.round(relativeY / cellHeight);

            const piece = activeDrag.pieceData;
            if (!piece) return;

            const canPlace = isValidPlacement(piece.shape, row, col);

            if (canPlace) {
                activeDrag.targetRow = row;
                activeDrag.targetCol = col;
                highlightGhost(piece.shape, row, col, true);
            } else {
                activeDrag.targetRow = -1;
                activeDrag.targetCol = -1;
                if (row >= -1 && row < GRID_SIZE && col >= -1 && col < GRID_SIZE) {
                    highlightGhost(piece.shape, row, col, false);
                }
            }
        }

        function onPointerUp(e) {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);

            if (activeDrag.slotIndex !== null) {
                const { slotIndex, pieceData, targetRow, targetCol } = activeDrag;

                if (targetRow !== -1 && targetCol !== -1 && isValidPlacement(pieceData.shape, targetRow, targetCol)) {
                    placePiece(pieceData, targetRow, targetCol);
                    trayPieces[slotIndex] = null;
                    soundEngine.playPlace();

                    renderTray();
                    processTurn();

                    if (trayPieces.every(p => p === null)) {
                        spawnTrayPieces();
                    } else {
                        checkGameOver();
                    }
                }

                dragProxy.classList.add('hidden');
                clearGhostHighlights();
                activeDrag.slotIndex = null;
            }
        }

        // ==========================================
        // 6. VALIDATION & GHOST HIGHLIGHTS
        // ==========================================
        function isValidPlacement(shape, startRow, startCol) {
            const rows = shape.length;
            const cols = shape[0].length;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1) {
                        const boardR = startRow + r;
                        const boardC = startCol + c;

                        if (boardR < 0 || boardR >= GRID_SIZE || boardC < 0 || boardC >= GRID_SIZE) {
                            return false;
                        }
                        if (gridState[boardR][boardC] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function highlightGhost(shape, startRow, startCol, isValid) {
            const rows = shape.length;
            const cols = shape[0].length;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1) {
                        const boardR = startRow + r;
                        const boardC = startCol + c;

                        if (boardR >= 0 && boardR < GRID_SIZE && boardC >= 0 && boardC < GRID_SIZE) {
                            const index = boardR * GRID_SIZE + boardC;
                            const cell = gridBoard.children[index];
                            if (cell) {
                                cell.classList.add(isValid ? 'ghost-valid' : 'ghost-invalid');
                            }
                        }
                    }
                }
            }
        }

        function clearGhostHighlights() {
            const cells = gridBoard.children;
            for (let i = 0; i < cells.length; i++) {
                cells[i].classList.remove('ghost-valid', 'ghost-invalid');
            }
        }

        function placePiece(pieceData, startRow, startCol) {
            const shape = pieceData.shape;
            let placedCount = 0;

            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c] === 1) {
                        gridState[startRow + r][startCol + c] = pieceData.color;
                        placedCount++;
                    }
                }
            }
            score += placedCount * 10;
            updateScoreDisplays();
            renderBoard();
        }

        // ==========================================
        // 7. LINE CLEARS, COMBOS & PARTICLES
        // ==========================================
        function processTurn() {
            const rowsToClear = [];
            const colsToClear = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                if (gridState[r].every(cell => cell !== null)) {
                    rowsToClear.push(r);
                }
            }

            for (let c = 0; c < GRID_SIZE; c++) {
                let isFull = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (gridState[r][c] === null) {
                        isFull = false;
                        break;
                    }
                }
                if (isFull) colsToClear.push(c);
            }

            const totalLinesCleared = rowsToClear.length + colsToClear.length;

            if (totalLinesCleared > 0) {
                comboStreak++;
                soundEngine.playClear(comboStreak);

                const cellsToAnimate = new Set();
                rowsToClear.forEach(r => {
                    for (let c = 0; c < GRID_SIZE; c++) cellsToAnimate.add(`${r},${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < GRID_SIZE; r++) cellsToAnimate.add(`${r},${c}`);
                });

                cellsToAnimate.forEach(coords => {
                    const [r, c] = coords.split(',').map(Number);
                    const cellIndex = r * GRID_SIZE + c;
                    const cellDOM = gridBoard.children[cellIndex];
                    if (cellDOM) {
                        cellDOM.classList.add('clearing');
                        const rect = cellDOM.getBoundingClientRect();
                        const boardRect = gridBoard.getBoundingClientRect();
                        const centerX = rect.left - boardRect.left + rect.width / 2;
                        const centerY = rect.top - boardRect.top + rect.height / 2;
                        particles.spawn(centerX, centerY, '#f43f5e', 8);
                    }
                });

                const bonusPoints = totalLinesCleared * 100 * comboStreak;
                score += bonusPoints;
                updateScoreDisplays();

                showComboPopup(totalLinesCleared, comboStreak);

                setTimeout(() => {
                    cellsToAnimate.forEach(coords => {
                        const [r, c] = coords.split(',').map(Number);
                        gridState[r][c] = null;
                    });
                    renderBoard();
                }, 300);

            } else {
                comboStreak = 0;
            }
        }

        function showComboPopup(lines, streak) {
            const popup = document.createElement('div');
            popup.className = 'combo-popup absolute top-1/2 left-1/2 font-black text-center z-40 pointer-events-none drop-shadow-2xl';
            
            let labelText = 'GREAT!';
            let colorClass = 'from-amber-400 via-rose-500 to-indigo-500';

            if (lines >= 3) {
                labelText = 'UNBELIEVABLE!!';
                colorClass = 'from-fuchsia-400 via-purple-500 to-cyan-400';
            } else if (lines === 2) {
                labelText = 'DOUBLE CLEAR!';
                colorClass = 'from-cyan-400 to-emerald-400';
            } else if (streak > 1) {
                labelText = `COMBO x${streak}!`;
            }

            popup.innerHTML = `
                <div class="text-4xl sm:text-5xl bg-clip-text text-transparent bg-gradient-to-r ${colorClass} tracking-widest uppercase">
                    ${labelText}
                </div>
            `;

            comboContainer.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        // ==========================================
        // 8. GAME OVER LOGIC
        // ==========================================
        function checkGameOver() {
            let canMoveExist = false;

            for (let i = 0; i < trayPieces.length; i++) {
                const piece = trayPieces[i];
                if (!piece) continue;

                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (isValidPlacement(piece.shape, r, c)) {
                            canMoveExist = true;
                            break;
                        }
                    }
                    if (canMoveExist) break;
                }
                if (canMoveExist) break;
            }

            const hasRemainingPieces = trayPieces.some(p => p !== null);
            if (hasRemainingPieces && !canMoveExist) {
                setTimeout(() => triggerGameOver(), 400);
            }
        }

        function triggerGameOver() {
            soundEngine.playGameOver();
            finalScoreEl.textContent = score;
            finalBestScoreEl.textContent = Math.max(score, bestScore);

            gameOverModal.classList.remove('pointer-events-none', 'opacity-0');
            gameOverModal.classList.add('opacity-100');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function hideGameOver() {
            gameOverModal.classList.add('pointer-events-none', 'opacity-0');
            gameOverModal.classList.remove('opacity-100');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }

        // ==========================================
        // 9. EVENT LISTENERS & INITIALIZATION
        // ==========================================
        restartBtn.addEventListener('click', () => {
            soundEngine.playPop(500);
            initGame();
        });

        modalRestartBtn.addEventListener('click', () => {
            soundEngine.playPop(500);
            initGame();
        });

        soundToggleBtn.addEventListener('click', () => {
            soundEngine.muted = !soundEngine.muted;
            if (soundEngine.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-slate-300';
                soundEngine.playPop(400);
            }
        });

        // Leaderboard modal toggle
        leaderboardBtn.addEventListener('click', () => {
            soundEngine.playPop(450);
            leaderboardModal.classList.remove('pointer-events-none', 'opacity-0');
            leaderboardModal.classList.add('opacity-100');
            leaderboardCard.classList.remove('scale-95');
            leaderboardCard.classList.add('scale-100');
            fetchGitHubLeaderboard();
        });

        closeLeaderboardBtn.addEventListener('click', () => {
            soundEngine.playPop(350);
            leaderboardModal.classList.add('pointer-events-none', 'opacity-0');
            leaderboardModal.classList.remove('opacity-100');
            leaderboardCard.classList.remove('scale-100');
            leaderboardCard.classList.add('scale-95');
        });

        // Submit Score to GitHub Button
        document.getElementById('submitScoreGithubBtn').addEventListener('click', () => {
            soundEngine.playPop(550);
            openGitHubScoreSubmission(bestScore);
        });

        // Save Nickname
        nicknameInput.value = playerNickname;
        saveNicknameBtn.addEventListener('click', () => {
            const newNick = nicknameInput.value.trim();
            if (newNick) {
                playerNickname = newNick;
                localStorage.setItem('blockblast_nickname', newNick);
                soundEngine.playPop(600);
            }
        });

        // Initialize Game
        window.onload = () => {
            initGame();
        };
    </script>
</body>
